
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter Programme</title>

    <style>
        body {
            background: #f4faff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            padding: 30px;
            width: 300px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 5px 20px #c9e6f5;
        }

        h2, #count {
            color: #168bd2;
        }

        #count {
            font-size: 50px;
            margin: 20px;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 5px;
            background: #168bd2;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #83d0ff;
            color: #142b40;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Counter Program</h2>

        <div id="count">0</div>

        <button onclick="decrease()">−</button>
        <button onclick="reset()">Reset</button>
        <button onclick="increase()">+</button>
    </div>

    <script>
        let count = 0;

        function increase() {
            count++;
            document.getElementById("count").textContent = count;
        }

        function decrease() {
            count--;
            document.getElementById("count").textContent = count;
        }

        function reset() {
            count = 0;
            document.getElementById("count").textContent = count;
        }
    </script>

</body>
</html>
