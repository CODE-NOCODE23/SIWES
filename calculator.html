
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4faff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .calculator {
            background: white;
            padding: 20px;
            width: 320px;
            border-radius: 12px;
            box-shadow: 0 5px 20px #c9e6f5;
        }

        input {
            width: 100%;
            padding: 15px;
            margin-bottom: 12px;
            font-size: 25px;
            text-align: right;
            border: 1px solid #a8d8f3;
            border-radius: 6px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        button {
            padding: 17px 10px;
            border: none;
            border-radius: 6px;
            background: #168bd2;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover, button:focus, button:active {
            background: #83d0ff;
            color: #142b40;
        }

        .symbol {
            background: #f0a44b;
        }

        .symbol:hover {
            background: #ffd08d;
        }
    </style>
</head>

<body>

    <div class="calculator">
        <input type="text" id="display" readonly>

        <div class="buttons">
            <button id="clear" class="symbol">C</button>
            <button id="backspace" class="symbol">DEL</button>
            <button id="open" class="symbol">(</button>
            <button id="close" class="symbol">)</button>

            <button id="number7">7</button>
            <button id="number8">8</button>
            <button id="number9">9</button>
            <button id="divide" class="symbol">÷</button>

            <button id="number4">4</button>
            <button id="number5">5</button>
            <button id="number6">6</button>
            <button id="multiply" class="symbol">×</button>

            <button id="number1">1</button>
            <button id="number2">2</button>
            <button id="number3">3</button>
            <button id="subtract" class="symbol">−</button>

            <button id="number0">0</button>
            <button id="decimal">.</button>
            <button id="equal" class="symbol">=</button>
            <button id="add" class="symbol">+</button>
        </div>
    </div>

    <script>
        const display = document.getElementById("display");

        number7.onclick = function() {
            display.value += "7";
        };

        number8.onclick = function() {
            display.value += "8";
        };

        number9.onclick = function() {
            display.value += "9";
        };

        number4.onclick = function() {
            display.value += "4";
        };

        number5.onclick = function() {
            display.value += "5";
        };

        number6.onclick = function() {
            display.value += "6";
        };

        number1.onclick = function() {
            display.value += "1";
        };

        number2.onclick = function() {
            display.value += "2";
        };

        number3.onclick = function() {
            display.value += "3";
        };

        number0.onclick = function() {
            display.value += "0";
        };

        decimal.onclick = function() {
            display.value += ".";
        };

        add.onclick = function() {
            display.value += "+";
        };

        subtract.onclick = function() {
            display.value += "-";
        };

        multiply.onclick = function() {
            display.value += "*";
        };

        divide.onclick = function() {
            display.value += "/";
        };

        open.onclick = function() {
            display.value += "(";
        };

        close.onclick = function() {
            display.value += ")";
        };

        clear.onclick = function() {
            display.value = "";
        };

        backspace.onclick = function() {
            display.value = display.value.slice(0, -1);
        };

        equal.onclick = function() {
            try {
                display.value = eval(display.value);
            }
            catch(error) {
                display.value = "Error!";
            }
        };
    </script>

</body>
</html>
